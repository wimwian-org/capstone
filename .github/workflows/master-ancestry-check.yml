name: Master Ancestry Check

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  verify-master-not-ahead-of-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: master must never be ahead of dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor HEAD origin/dev; then
            echo "OK: this ref is an ancestor of (or equal to) origin/dev"
          else
            echo "FAIL: this would move master ahead of dev — merge to dev first, then fast-forward master"
            exit 1
          fi
