# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Devops.Release runs `git cliff --tag <tag> --tag-pattern "^v" -o
# CHANGELOG.md` as part of `mix devops.release` (see
# deps/devops/lib/devops/release.ex), rewriting the whole file from full
# history every release — one section per tag, oldest first, which is
# what "consolidated" means here: a single file, not a changelog fragment
# per release.
#
# Groups mirror config/devops.exs's :commit_types table exactly, in the
# same order: every type that bumps the minor version groups under its
# own heading, every type that bumps the patch version under its own,
# and every type Devops.Version treats as :none (no version impact) is
# skipped here too — a commit invisible to versioning stays invisible in
# the changelog. A type absent from both tables (falls back to :patch in
# Devops.Version) falls into "Other" here, for the same reason.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here, generated by
`git cliff` as part of `mix devops.release`.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}**BREAKING** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
# A breaking marker matters regardless of which group's parser would
# otherwise skip the commit — same reasoning Devops.Version applies to
# escalation, kept true here even though :none types are never escalated
# there: a breaking chore is still worth a human reading the changelog.
protect_breaking_commits = true
tag_pattern = "^v"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = ".*", group = "Other" },
]
